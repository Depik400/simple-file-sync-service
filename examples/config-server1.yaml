server:
  name: "server-1"
  host: "localhost"
  port: 8090
  web_port: 8090
  sync_dir: "./examples/sync_data_server1"

peers:
  server-2:
    host: "localhost"
    port: 7071
  server-3:
    host: "localhost"
    port: 7073
    
sync:
  interval: 30  # seconds
  max_concurrent_transfers: 5
  chunk_size: 8388608  # 8MB chunks for large files

database:
  path: "./examples/file_sync_server1.db"

logging:
  level: "info"
  file: "./examples/logs/file_sync_server1.log"