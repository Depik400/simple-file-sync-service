server:
  name: "server-2"
  host: "localhost"
  port: 7071
  web_port: 7071
  sync_dir: "./examples/sync_data_server2"

peers:
  server-1:
    host: "localhost"
    port: 8090
  server-3:
    host: "localhost"
    port: 7073

sync:
  interval: 30
  max_concurrent_transfers: 5
  chunk_size: 8388608  # 8MB chunks for large files
  max_parallel_chunks: 4  # parallel chunks per file (0 = disable parallel)

database:
  path: "./examples/file_sync_server2.db"

logging:
  level: "info"
  file: "./examples/logs/file_sync_server2.log"